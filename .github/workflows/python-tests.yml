name: Python project checks

on:
  push:
    paths:
      - "revrag-ai/**"
      - "tekravio/**"
      - "forest-ai/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "revrag-ai/**"
      - "tekravio/**"
      - "forest-ai/**"
      - ".github/workflows/python-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [revrag-ai, tekravio, forest-ai]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
